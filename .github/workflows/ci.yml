name: CI

# 发布前的基本校验：类型检查、lint、单元测试、前端构建。
# 之前仓库里只有 tag 触发的 release.yml，也就是说 main 分支上的任何提交
# 都不会被构建或测试，问题只会在发版时才暴露。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # 必须先生成 dist/：tauri::generate_context! 在编译期会读取并内嵌前端产物，
      # 没有 dist/ 时 cargo check/clippy/test 都会直接编译失败。
      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Verify no runtime data files are tracked
        shell: pwsh
        run: |
          # 真实凭证曾因 config.toml 被跟踪而泄露到公开仓库，
          # 这里把「数据文件混进版本控制」变成一次明确的构建失败。
          $forbiddenNames = @(
            'config.toml',
            'bilibili_cookie.json',
            'history.db',
            'history.json',
            'history.json.bak',
            'video_cache.json'
          )
          # 例外：cargo 配置是源码（不是运行时数据），名字撞上了 config.toml
          $allowed = @('src-tauri/.cargo/config.toml')

          $bad = @()
          foreach ($f in (git ls-files)) {
            $norm = $f -replace '\\', '/'
            if ($allowed -contains $norm) { continue }

            $name = Split-Path $f -Leaf
            if ($forbiddenNames -contains $name) { $bad += $f; continue }
            if ($name -like '*.log') { $bad += $f; continue }
            if ($norm -like 'logs/*' -or $norm -like '*/logs/*') { $bad += $f; continue }
          }

          if ($bad.Count -gt 0) {
            Write-Error "以下运行时数据文件不应被提交（可能包含凭证）：`n$($bad -join "`n")"
            exit 1
          }
          Write-Host "OK: 未发现被跟踪的运行时数据文件"
