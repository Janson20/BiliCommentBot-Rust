[package]
name = "bili-comment-bot-rs"
version = "0.1.5"
description = "B站评论自动回复机器人 - Rust + Tauri 桌面版"
authors = ["BiliCommentBot Contributors"]
license = "MIT"
edition = "2021"
# 需要 1.89+：单实例保护用到 std::fs::File::try_lock（1.89 稳定）
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "dialog-open", "window-all", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
toml_edit = { version = "0.22", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "gzip", "deflate", "brotli", "cookies", "charset"] }
tokio = { version = "1", features = ["full"] }
md5 = "0.7"
bcrypt = "0.16"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
anyhow = "1"
urlencoding = "2"
rand = "0.8"
regex = "1"
qrcode = "0.14"  # qrcode generation (image feature for PNG output)
image = { version = "0.25", default-features = false, features = ["png"] }

# 开机自启（写入 HKCU\Software\Microsoft\Windows\CurrentVersion\Run）
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 发行版优化：体积与启动时间（README 主打「< 8MB 安装包」）
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
incremental = false
